name: Navigator native checkpoint
on:
  workflow_dispatch:
  push:
    branches: ['feature/w1-projection-spine']
    paths:
      - 'src/Ymm4HighlightNavigator.Plugin/**'
      - 'tests/Ymm4HighlightNavigator.Plugin.Tests/**'
      - '.github/workflows/native.yml'
permissions:
  contents: read
concurrency:
  group: navigator-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product-native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare pinned host and generated media
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet --list-sdks | Tee-Object dotnet-sdks.txt
          if(-not(Select-String dotnet-sdks.txt -Pattern '^10\.')){throw '.NET 10 SDK missing'}
          curl.exe -L --fail --retry 2 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.56.1.0/YukkuriMovieMaker_v4.56.1.0_Lite.zip
          if($LASTEXITCODE -ne 0){throw 'Host download blocked'}
          if((Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'){throw 'Host hash mismatch'}
          Expand-Archive ymm4.zip ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if(-not $exe){throw 'Host executable missing'}
          "YMM4_DIR=$($exe.Directory.FullName)\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          choco install ffmpeg --version=7.1.1 -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'Fixture FFmpeg installation blocked'}
          $binary=Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $probe=Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if(-not $binary -or -not $probe){throw 'Real backend files missing'}
          "FFMPEG_EXE=$($binary.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FFPROBE_EXE=$($probe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          python tools/fixtures/generate.py --ffmpeg $binary.FullName --output out/fixture/lossless.mkv
          if($LASTEXITCODE -ne 0){throw 'Fixture generation failed'}
          & $binary.FullName -nostdin -hide_banner -loglevel error -i out/fixture/lossless.mkv -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac out/fixture/source.mp4
          if($LASTEXITCODE -ne 0){throw 'Host-compatible fixture failed'}
      - name: Build real distribution and separate proof assembly
        shell: pwsh
        run: |
          dotnet build src/Ymm4HighlightNavigator.Plugin -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -o out/distribution --nologo -warnaserror 2>&1 | Tee-Object out-build.txt
          if($LASTEXITCODE -ne 0){throw 'Product build failed'}
          $navigator=(Join-Path $PWD 'out/distribution')+'\'
          dotnet build tests/Ymm4HighlightNavigator.Plugin.Tests -c Release "-p:YMM4DirPath=$env:YMM4_DIR" "-p:NavigatorDirPath=$navigator" -o out/proof --nologo -warnaserror 2>&1 | Tee-Object out-proof-build.txt
          if($LASTEXITCODE -ne 0){throw 'Proof build failed'}
          $unexpected=Get-ChildItem out/distribution -Filter '*.dll' | Where-Object Name -notin @('Ymm4HighlightNavigator.Plugin.dll','Ymm4HighlightNavigator.Core.dll')
          if($unexpected){throw 'Host or unintended dependency leaked into distribution'}
          $dest=Join-Path $env:YMM4_DIR 'user/plugin/Ymm4HighlightNavigator'
          New-Item -ItemType Directory -Force (Join-Path $dest 'tools') | Out-Null
          Copy-Item out/distribution/*.dll $dest
          Copy-Item out/proof/Ymm4HighlightNavigator.Plugin.Tests.dll $dest
          Copy-Item $env:FFMPEG_EXE (Join-Path $dest 'tools/ffmpeg.exe')
          Copy-Item $env:FFPROBE_EXE (Join-Path $dest 'tools/ffprobe.exe')
          Get-FileHash out/distribution/*.dll -Algorithm SHA256 | Format-List | Out-File out/distribution-hashes.txt
      - name: Real YMM4 product regression
        shell: pwsh
        run: ./tests/Ymm4HighlightNavigator.Plugin.Tests/RunNative.ps1 -Ymm4Dir $env:YMM4_DIR -OutputDir (Join-Path $PWD 'out/evidence') -MediaPath (Join-Path $PWD 'out/fixture/source.mp4')
      - name: Independent exact distribution hash gate
        shell: pwsh
        run: |
          $r=Get-Content out/evidence/summary.json -Raw | ConvertFrom-Json
          $expected=(Get-FileHash out/distribution/Ymm4HighlightNavigator.Plugin.dll -Algorithm SHA256).Hash
          if($r.productHash -ne $expected){throw 'The native host did not test the distribution DLL'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: navigator-native-checkpoint
          path: |
            out/distribution/
            out/evidence/
            out-build.txt
            out-proof-build.txt
            dotnet-sdks.txt
          if-no-files-found: error
          retention-days: 7
